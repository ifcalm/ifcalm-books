name: README catalog

on:
  pull_request:
    paths:
      - "content/posts/**"
      - "scripts/update_readme_catalog.py"
      - "README.md"
      - ".github/workflows/readme-catalog.yml"
  push:
    paths:
      - "content/posts/**"
      - "scripts/update_readme_catalog.py"
      - "README.md"
      - ".github/workflows/readme-catalog.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify README catalog
        run: python3 scripts/update_readme_catalog.py --check
